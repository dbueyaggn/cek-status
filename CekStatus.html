<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cek Status Pengumpulan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--aqua:#5bc2c7;--aqua-deep:#0d6972;--aqua-pale:#dff5f3;--cream:#f7f0e0;--navy:#1f2389;--pink:#ff0066;--ink:#172b35;--muted:#66767d;--line:#d7dedc;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;background:var(--cream);color:var(--ink);font:14px/1.6 'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(91,194,199,.8);outline-offset:2px}
[hidden]{display:none!important}
.hd{background:#fff;border-bottom:1px solid var(--line)}
.hd div{max-width:720px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:11px}
.hd img{width:44px;height:44px;object-fit:contain}
.hd b{display:block;font:700 18px/1 var(--serif);color:var(--navy)}.hd small{display:block;margin-top:5px;font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--aqua-deep)}
main{max-width:720px;margin:0 auto;padding:28px 20px 60px}
.eb{margin:0 0 6px;font-size:11px;font-weight:600;color:var(--aqua-deep)}
h1{margin:0;font:700 clamp(26px,6vw,36px)/1.12 var(--serif);color:var(--navy);letter-spacing:-.03em}
.sub{margin:10px 0 20px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(23,43,53,.09);padding:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--aqua-deep);margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=email]{flex:1;min-width:220px;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#f7f8f6;font-size:15px}
.btn{height:46px;padding:0 22px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.hint{margin:10px 0 0;font-size:12px;color:var(--muted)}
#hasil{margin-top:18px;display:grid;gap:14px}
.ban{border-radius:14px;padding:14px 16px;border:1px solid}
.ban b{display:block;font:700 18px/1.3 var(--serif)}
.ban.lengkap{background:#e1f3dc;border-color:#a9d79c;color:#245a38}
.ban.kurang{background:#fff2cc;border-color:#ecd48a;color:#6e5010}
.ban.belum{background:#ffe0ec;border-color:#f5b3cc;color:#8c0040}
.ban.info{background:var(--aqua-pale);border-color:#b6e3e0;color:var(--aqua-deep)}
.tim{font-size:12.5px;color:var(--muted);margin:2px 0 10px}.tim b{color:var(--ink)}
ul.cl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.cl li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
ul.cl .i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.ok .i{background:#3c9a5f}.no .i{background:var(--pink)}
ul.cl .s{margin-left:auto;font-size:12px;font-weight:600}.ok .s{color:#2f7a4c}.no .s{color:#b0004a}
.bantu{font-size:13px;line-height:1.7}
.bantu ol{margin:6px 0 0;padding-left:20px}
.ft{font-size:11.5px;color:var(--muted)}
.card+.card{margin-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main>
  <p class="eb">Untuk peserta</p>
  <h1>Cek status pengumpulan karyamu</h1>
  <p class="sub">Masukkan email akun Google Classroom yang kamu pakai untuk mengumpulkan. Kamu hanya akan melihat status milikmu sendiri.</p>
  <div class="card">
    <label for="em">Email Classroom</label>
    <div class="row"><input type="email" id="em" autocomplete="email" inputmode="email" placeholder="namakamu@gmail.com"><button class="btn" id="go" type="button">Cek status</button></div>
    <p class="hint">Email tidak disimpan. Gunakan email yang sama dengan yang dipakai saat bergabung di Classroom.</p>
    <div id="hasil" aria-live="polite"></div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) { const v = attrs[k]; if (v === null || v === undefined || v === false) continue; if (k === 'class') e.className = v; else e.setAttribute(k, v === true ? '' : v); }
  kids.flat().forEach((c) => { if (c === null || c === undefined || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
/* Alamat web app Apps Script (.../exec). Isi di sini kalau halaman ini di-hosting statis (Netlify, Cloudflare, dll). */
const API_URL = 'https://script.google.com/macros/s/AKfycbwBes3FfY8jaVyFlvn0nC5fMPE69RDFRbPdDVD9O_SmmqTY6q03ThmTk2ueRYD71z37HQ/exec';
const BASE = API_URL || new URLSearchParams(location.search).get('api') || '';
function api(fn, ...args) {
  if (window.google && google.script && google.script.run) {
    return new Promise((ok, no) => google.script.run.withSuccessHandler(ok)
      .withFailureHandler((e) => no(new Error(e && e.message ? e.message : String(e))))[fn](...args));
  }
  if (!BASE) return Promise.reject(new Error('Halaman belum tersambung ke server. Hubungi panitia.'));
  return fetch(BASE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then((r) => r.json())
    .then((j) => { if (!j.ok) throw new Error(j.message || 'Gagal'); return j.r; });
}
function waktuId(iso) {
  try { return new Date(iso).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB'; } catch (e) { return ''; }
}
const JUDUL = {
  lengkap: 'Lengkap. Submitanmu sudah kami terima.',
  kurang: 'Sudah turn-in, tetapi belum lengkap.',
  belum: 'Belum turn-in. Karyamu belum kami terima.'
};
function kartu(h, d) {
  const box = el('div', { class: 'card' });
  box.append(el('div', { class: 'ban ' + h.verdict, role: 'status' }, el('b', null, JUDUL[h.verdict])));
  box.append(el('p', { class: 'tim' }, 'Tim: ', el('b', null, h.tim || '-'), h.waktu ? '  ·  Turn-in/update terakhir: ' + h.waktu : ''));
  const item = (nama, ada) => el('li', { class: ada ? 'ok' : 'no' }, el('span', { class: 'i', 'aria-hidden': 'true' }, ada ? '✓' : '✗'), nama, el('span', { class: 's' }, ada ? 'Diterima' : 'Belum ada'));
  box.append(el('ul', { class: 'cl' }, item('Poster', h.poster), item('Deskripsi', h.deskripsi), item('Surat', h.surat)));
  if (h.verdict !== 'lengkap') {
    const langkah = h.verdict === 'belum'
      ? ['Buka tugas di Google Classroom.', 'Pastikan semua berkas (poster, deskripsi, surat) sudah terlampir.', 'Tekan tombol Turn-in / Kumpulkan sampai statusnya berubah.']
      : ['Buka tugas di Google Classroom lalu pilih Batalkan pengiriman (Unsubmit).', 'Lampirkan berkas yang kurang: ' + h.kurang.join(', ') + '.', 'Tekan Turn-in / Kumpulkan lagi' + (d.batas ? ' sebelum ' + d.batas : '') + '.'];
    box.append(el('div', { class: 'bantu', style: 'margin-top:14px' }, el('b', null, 'Yang perlu kamu lakukan:'), el('ol', null, langkah.map((l) => el('li', null, l)))));
  }
  return box;
}
function tampil(d) {
  const out = $('#hasil'); out.innerHTML = '';
  if (!d.ok) { out.append(el('div', { class: 'ban belum', role: 'alert' }, d.pesan || 'Terjadi masalah.')); return; }
  if (!d.ditemukan) {
    out.append(el('div', { class: 'ban info', role: 'status' }, el('b', null, 'Email tidak ditemukan.'),
      el('div', null, 'Kemungkinan: email berbeda dari yang dipakai di Classroom, kamu belum bergabung di Classroom, atau datamu belum diperbarui panitia. Coba email lain atau hubungi panitia.' + (d.kontak ? ' ' + d.kontak : ''))));
    return;
  }
  out.append(...d.hasil.map((h) => kartu(h, d)));
  const wkt = d.diperbarui ? waktuId(d.diperbarui) : '';
  out.append(el('p', { class: 'ft' }, 'Data diperbarui panitia secara berkala' + (wkt ? ' (terakhir: ' + wkt + ')' : '') + ', jadi pengiriman yang baru beberapa menit lalu mungkin belum terlihat. Cek lagi nanti sebelum menghubungi panitia.' + (d.kontak ? ' ' + d.kontak : '')));
}
function cek() {
  const email = $('#em').value.trim();
  if (!email) { $('#em').focus(); return; }
  $('#go').disabled = true; $('#go').textContent = 'Mengecek…'; $('#hasil').innerHTML = '';
  api('api_cek_status', email).then(tampil)
    .catch((e) => tampil({ ok: false, pesan: e.message || 'Gagal. Coba lagi.' }))
    .finally(() => { $('#go').disabled = false; $('#go').textContent = 'Cek status'; });
}
$('#go').onclick = cek;
$('#em').onkeydown = (e) => { if (e.key === 'Enter') cek(); };
</script>
</body>
</html>
